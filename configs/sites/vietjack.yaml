  # The quiz table of contents of a book, e.g. vat-li-11-kn/trac-nghiem-vat-li-lop-11-ket-noi.jsp
  - pattern: '^https://vietjack\.com/(vat-li|toan|hoa-hoc|sinh|sinh-hoc|lich-su|dia-li|kinh-te-phap-luat)-1[012]-(kn|ct|cd)/trac-nghiem-(vat-li|toan|hoa-hoc|sinh-hoc|lich-su|dia-li|kinh-te-phap-luat)-(lop-)?1[012][a-z0-9-]*\.jsp$'
    kind: listing
  # Lesson and end-of-chapter quizzes (chapter pages "trac-nghiem-chuong-…" only repeat lessons)
  - pattern: '^https://vietjack\.com/(vat-li|toan|hoa-hoc|sinh|sinh-hoc|lich-su|dia-li|kinh-te-phap-luat)-1[012]-(kn|ct|cd)/trac-nghiem-(?!vat-li|toan|hoa-hoc|sinh-hoc|lich-su|dia-li|kinh-te-phap-luat|chuong)[a-z0-9-]+\.jsp$'
    kind: detail
categories:
  # Fallback for pages crawled before auto_toc (no context): "Bài N" inside Vật lí 11.
  - pattern: '/vat-li-11-kn/'
    root: Vật lí 11
    lesson: 'bài\s*(\d+)'
