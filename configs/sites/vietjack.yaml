# VietJack — trắc nghiệm Vật lí + Toán 10–12, three series (Kết nối tri thức, Chân trời sáng tạo, Cánh diều).
# Seeds are the book indexes; each links its quiz table of contents, whose h3 chapters and "Bài N" links
# build our table of contents (auto_toc). Generated by a script; edit freely.
site_id: vietjack
name: VietJack
enabled: true
base_url: https://vietjack.com
parser: vietjack_quiz
schedule_times: ["03:30"]
refresh_days: 30
max_pages: 200            # per run; later runs skip pages fetched within refresh_days, so a book fills up over days
respect_robots: true      # vietjack.com has no robots.txt (404): everything allowed, the delay still applies
auto_publish: true
auto_toc: true
default_difficulty: UNDERSTANDING
rate_limit:
  delay_sec: 3
  timeout_sec: 20
  retries: 2
  concurrency: 1
toc:
  scope: ["//div[contains(@class, 'middle-col')]"]
seeds:
  - url: https://vietjack.com/vat-li-10-kn/index.jsp
    label: Vật lí 10 – Kết nối tri thức
    root: Vật lí 10
    series: Kết nối tri thức
    scope_prefix: https://vietjack.com/vat-li-10-kn/
  - url: https://vietjack.com/vat-li-10-ct/index.jsp
    label: Vật lí 10 – Chân trời sáng tạo
    root: Vật lí 10
    series: Chân trời sáng tạo
    scope_prefix: https://vietjack.com/vat-li-10-ct/
  - url: https://vietjack.com/vat-li-10-cd/index.jsp
    label: Vật lí 10 – Cánh diều
    root: Vật lí 10
    series: Cánh diều
    scope_prefix: https://vietjack.com/vat-li-10-cd/
  - url: https://vietjack.com/vat-li-11-kn/index.jsp
    label: Vật lí 11 – Kết nối tri thức
    root: Vật lí 11
    series: Kết nối tri thức
    scope_prefix: https://vietjack.com/vat-li-11-kn/
  - url: https://vietjack.com/vat-li-11-ct/index.jsp
    label: Vật lí 11 – Chân trời sáng tạo
    root: Vật lí 11
    series: Chân trời sáng tạo
    scope_prefix: https://vietjack.com/vat-li-11-ct/
  - url: https://vietjack.com/vat-li-11-cd/index.jsp
    label: Vật lí 11 – Cánh diều
    root: Vật lí 11
    series: Cánh diều
    scope_prefix: https://vietjack.com/vat-li-11-cd/
  - url: https://vietjack.com/vat-li-12-kn/index.jsp
    label: Vật lí 12 – Kết nối tri thức
    root: Vật lí 12
    series: Kết nối tri thức
    scope_prefix: https://vietjack.com/vat-li-12-kn/
  - url: https://vietjack.com/vat-li-12-ct/index.jsp
    label: Vật lí 12 – Chân trời sáng tạo
    root: Vật lí 12
    series: Chân trời sáng tạo
    scope_prefix: https://vietjack.com/vat-li-12-ct/
  - url: https://vietjack.com/vat-li-12-cd/index.jsp
    label: Vật lí 12 – Cánh diều
    root: Vật lí 12
    series: Cánh diều
    scope_prefix: https://vietjack.com/vat-li-12-cd/
  - url: https://vietjack.com/toan-10-kn/index.jsp
    label: Toán 10 – Kết nối tri thức
    root: Toán 10
    series: Kết nối tri thức
    scope_prefix: https://vietjack.com/toan-10-kn/
  - url: https://vietjack.com/toan-10-ct/index.jsp
    label: Toán 10 – Chân trời sáng tạo
    root: Toán 10
    series: Chân trời sáng tạo
    scope_prefix: https://vietjack.com/toan-10-ct/
  - url: https://vietjack.com/toan-10-cd/index.jsp
    label: Toán 10 – Cánh diều
    root: Toán 10
    series: Cánh diều
    scope_prefix: https://vietjack.com/toan-10-cd/
  - url: https://vietjack.com/toan-11-kn/index.jsp
    label: Toán 11 – Kết nối tri thức
    root: Toán 11
    series: Kết nối tri thức
    scope_prefix: https://vietjack.com/toan-11-kn/
  - url: https://vietjack.com/toan-11-ct/index.jsp
    label: Toán 11 – Chân trời sáng tạo
    root: Toán 11
    series: Chân trời sáng tạo
    scope_prefix: https://vietjack.com/toan-11-ct/
  - url: https://vietjack.com/toan-11-cd/index.jsp
    label: Toán 11 – Cánh diều
    root: Toán 11
    series: Cánh diều
    scope_prefix: https://vietjack.com/toan-11-cd/
  - url: https://vietjack.com/toan-12-kn/index.jsp
    label: Toán 12 – Kết nối tri thức
    root: Toán 12
    series: Kết nối tri thức
    scope_prefix: https://vietjack.com/toan-12-kn/
  - url: https://vietjack.com/toan-12-ct/index.jsp
    label: Toán 12 – Chân trời sáng tạo
    root: Toán 12
    series: Chân trời sáng tạo
    scope_prefix: https://vietjack.com/toan-12-ct/
  - url: https://vietjack.com/toan-12-cd/index.jsp
    label: Toán 12 – Cánh diều
    root: Toán 12
    series: Cánh diều
    scope_prefix: https://vietjack.com/toan-12-cd/
follow:
  # The quiz table of contents of a book, e.g. vat-li-11-kn/trac-nghiem-vat-li-lop-11-ket-noi.jsp
  - pattern: '^https://vietjack\.com/(vat-li|toan)-1[012]-(kn|ct|cd)/trac-nghiem-(vat-li|toan)-(lop-)?1[012][a-z0-9-]*\.jsp$'
    kind: listing
  # Lesson and end-of-chapter quizzes (chapter pages "trac-nghiem-chuong-…" only repeat lessons)
  - pattern: '^https://vietjack\.com/(vat-li|toan)-1[012]-(kn|ct|cd)/trac-nghiem-(?!vat-li|toan|chuong)[a-z0-9-]+\.jsp$'
    kind: detail
categories:
  # Fallback for pages crawled before auto_toc (no context): "Bài N" inside Vật lí 11.
  - pattern: '/vat-li-11-kn/'
    root: Vật lí 11
    lesson: 'bài\s*(\d+)'
