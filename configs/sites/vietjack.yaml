# VietJack — trắc nghiệm Vật lí, Toán, Hoá học, Sinh học, Lịch sử, Địa lí, GDKT&PL 10–12, three series (Kết nối tri thức, Chân trời sáng tạo, Cánh diều).
# Seeds are the book indexes; each links its quiz table of contents, whose h3 chapters and "Bài N" links
# build our table of contents (auto_toc). Generated by a script; edit freely.
site_id: vietjack
name: VietJack
enabled: true
base_url: https://vietjack.com
parser: vietjack_quiz
schedule_times: ["03:30"]
refresh_days: 30
max_pages: 400            # per run (63 books: their tables of contents come first); later runs skip pages fetched within refresh_days, so a book fills up over days
respect_robots: true      # vietjack.com has no robots.txt (404): everything allowed, the delay still applies
auto_publish: true
auto_toc: true
default_difficulty: UNDERSTANDING
rate_limit:
  delay_sec: 3
  timeout_sec: 20
  retries: 2
  concurrency: 1
toc:
  scope: ["//div[contains(@class, 'middle-col')]"]
