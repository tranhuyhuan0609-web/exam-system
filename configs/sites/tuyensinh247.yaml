# Tuyensinh247 — luyện chuyên đề ôn thi THPT (Vật lí, Toán). robots.txt allows these pages (it forbids /learning/).
# Topic pages list 10 questions per page with ids only; the question pages (bai-tap-<id>.html) carry the answer,
# the method and the full solution, a level label (Nhận biết…) and formulas as images with LaTeX alt text.
# Content follows the pre-2018 THPT programme, so it gets its own "Ôn thi THPT" roots in our table of contents.
site_id: tuyensinh247
name: Tuyensinh247
enabled: true
base_url: https://tuyensinh247.com
parser: tuyensinh247_question
schedule_times: ["05:00"]
refresh_days: 60
max_pages: 200
respect_robots: true
auto_publish: true
auto_toc: true
default_difficulty: UNDERSTANDING
rate_limit:
  delay_sec: 3
  timeout_sec: 20
  retries: 2
  concurrency: 1
