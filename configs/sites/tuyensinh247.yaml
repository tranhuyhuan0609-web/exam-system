# Tuyensinh247 — luyện chuyên đề ôn thi THPT (Vật lí, Toán, Hoá học, Sinh học, Tiếng Anh) and ôn thi vào 10 (Toán,
# Tiếng Anh, Vật lí, Hoá học); Ngữ văn has no multiple choice. Hubs: luyen-thi-dai-hoc-mon-x-ct<id>.html (the id
# alone matters). robots.txt allows these pages (it forbids /learning/).
# Topic pages list 10 questions per page with ids only; the question pages (bai-tap-<id>.html) carry the answer,
# the method and the full solution, a level label (Nhận biết…) and formulas as images with LaTeX alt text.
# Content follows the pre-2018 THPT programme, so it gets its own "Ôn thi THPT" roots in our table of contents.
