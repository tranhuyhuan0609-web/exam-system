# HOC247 — đề thi giữa kì và học kì, lớp 6–12, mọi môn có đề (Ngữ văn: tự luận). Seeds found from the site's
# own menus (3 indexes per subject and grade, ~4,800 exams). robots.txt forbids /lam-bai-thi/ and /bat-dau-lam-bai/ (the
# online test pages): we only read the exam pages and the question pages, which it allows.
# Question pages show the answer key and solution; some keys are wrong, so verify_answers has the AI re-check them.
site_id: hoc247
name: HOC247
enabled: true
base_url: https://hoc247.net
parser: hoc247_question
schedule_times: ["00:30", "04:30", "08:30", "12:30", "16:30", "20:30"]  # large crawl: every 4 h
refresh_days: 60
max_pages: 2000           # per run (~100 min at 3 s a page); one exam = 1 page + ~40 question pages
respect_robots: true
auto_publish: true
auto_toc: true
verify_answers: true
verify_ratio: 0.1       # check 1 question in 10 (AI quota at this volume); doubtful keys go to review
default_difficulty: UNDERSTANDING
rate_limit:
  delay_sec: 3
  timeout_sec: 20
  retries: 2
  concurrency: 1
toc:
  scope: ["//ul[contains(@class, 'dsch')]", "//div[contains(@class, 'box-content')]"]
