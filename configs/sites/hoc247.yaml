# HOC247 — đề thi giữa học kì Toán và Vật lí 10–12. robots.txt forbids /lam-bai-thi/ and /bat-dau-lam-bai/ (the
# online test pages): we only read the exam pages and the question pages, which it allows.
# Question pages show the answer key and solution; some keys are wrong, so verify_answers has the AI re-check them.
site_id: hoc247
name: HOC247
enabled: true
base_url: https://hoc247.net
parser: hoc247_question
schedule_times: ["04:30"]
refresh_days: 60
max_pages: 200            # one exam = 1 page + ~40 question pages
respect_robots: true
auto_publish: true
auto_toc: true
verify_answers: true
verify_ratio: 0.2       # check 1 question in 5 (saves AI quota); doubtful keys go to review
default_difficulty: UNDERSTANDING
rate_limit:
  delay_sec: 3
  timeout_sec: 20
  retries: 2
  concurrency: 1
toc:
  scope: ["//ul[contains(@class, 'dsch')]", "//div[contains(@class, 'box-content')]"]
seeds:
  - url: https://hoc247.net/de-thi-giua-hoc-ki-1-lop-10-mon-toan-index.html
    label: Toán 10 – Đề thi giữa học kì 1
    root: Toán 10
    chapter: Đề thi giữa học kì 1
