# Open sources harvested into the library and the question bank: python -m app.pipeline.harvest (see its docstring).
# Each plan item keeps a cursor in MongoDB (harvest_state): every run reads `pages` more pages and goes on next time.
# OpenAlex pages hold 200 works, Semantic Scholar 1000, Crossref 500, Open Library 100, Gutendex 32.
# Without OPENALEX_API_KEY OpenAlex shares ~1000 requests a day per IP; with a free key (openalex.org/settings/api)
# raise pages_per_run. Open PDFs are fetched all day into our storage; readers only see works whose file we hold.
schedule_times:
- 01:30
- 09:30
- '17:30'
pages_per_run: 30
files_per_run: 200  # per batch; batches run all day between harvest runs
file_concurrency: 6
max_storage_gb: 100  # open PDFs stop here: raise it with more disk space
max_file_mb: 25
