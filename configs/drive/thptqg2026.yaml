# Thư mục Google Drive công khai "Tailieu @thptqg2026" (kho tài liệu do cộng đồng đóng góp).
# Rights differ per folder: official exams are published, teachers' contributions wait for an admin to check the
# source. Textbooks (KHO SÁCH), IELTS and HSK books are copyrighted: only listed (index_only), never copied.
# "targets": files whose path matches also go to the AI exam import (Gemini reads pages: quota permitting).
# The scheduler takes `max_files` files per run, every `every_hours` (sooner while files are left): Google blocks
# bursts of automated downloads, so a large folder comes in a little at a time.
source_id: thptqg2026
name: Tailieu @thptqg2026
folder_id: 1kYsUS6BtdAH6TTcStJx5AJK4N5DTGJv4
max_files: 30
every_hours: 3
download_delay: 3
include:
  - folder: "9. FULL ĐỀ THI THPTQG2024 (BỘ GD&ĐT)"
    kind: EXAM
    status: PUBLISHED
    downloadable: true
    license_note: Đề thi chính thức của Bộ GD&ĐT, đã công bố công khai
    targets:
      - match: 'to[aá]n'
        category: [Ôn thi THPT – Toán, Đề thi THPT 2024]
      # Địa lí before Vật lí: "Địa lý" holds "lý"
      - match: '[đd][iị]a\s*l[iíý]|(^|[^a-zà-ỹ])[đd][iị]a([^a-zà-ỹ]|$)'
        category: [Ôn thi THPT – Địa lí, Đề thi THPT 2024]
      - match: 'v[aậ]t\s*l[iíyý]|(^|[^a-zà-ỹ])l[ýí]([^a-zà-ỹ]|$)'
        category: [Ôn thi THPT – Vật lí, Đề thi THPT 2024]
