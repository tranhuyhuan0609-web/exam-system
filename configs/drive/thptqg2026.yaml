        category: [Ôn thi THPT – Hoá học, Đề thi THPT 2024]
      - match: 'sinh\s*h[oọ]c|(^|[^a-zà-ỹ])sinh([^a-zà-ỹ]|$)'
        category: [Ôn thi THPT – Sinh học, Đề thi THPT 2024]
      - match: 'l[iị]ch\s*s[uử]|(^|[^a-zà-ỹ])s[uử]([^a-zà-ỹ]|$)'
        category: [Ôn thi THPT – Lịch sử, Đề thi THPT 2024]
      - match: 'gdcd|gi[aá]o\s*d[uụ]c\s*c[oô]ng\s*d[aâ]n|ktpl|kinh\s*t[eế]\s*(v[aà]\s*)?ph[aá]p\s*lu[aậ]t'
