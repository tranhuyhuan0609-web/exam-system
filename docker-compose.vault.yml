# Production overlay: durable HashiCorp Vault (Transit) holds the per-user keys of PII, so erasure really shreds backups.
#   docker compose --env-file .env.pilot -f docker-compose.pilot.yml -f docker-compose.vault.yml up -d vault
#   ... initialize / unseal / create the token once (docs/pilot/PRODUCTION_HARDENING.md), put VAULT_TOKEN in .env.pilot, then
#   docker compose --env-file .env.pilot -f docker-compose.pilot.yml -f docker-compose.vault.yml up -d app worker
services:
  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    command: ["server"]  # the image reads every file of /vault/config by itself (a second -config would bind twice)
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./deploy/vault/vault.hcl:/vault/config/vault.hcl:ro
      - ./deploy/vault/ulp-transit-policy.hcl:/vault/policy/ulp-transit-policy.hcl:ro
      - vaultdata:/vault/file

  app:
    environment:
      KEY_SERVICE_BACKEND: vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:?set VAULT_TOKEN (docs/pilot/PRODUCTION_HARDENING.md)}
    depends_on:
      - vault

  worker:
    environment:
      KEY_SERVICE_BACKEND: vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:?set VAULT_TOKEN (docs/pilot/PRODUCTION_HARDENING.md)}

volumes:
  vaultdata:
