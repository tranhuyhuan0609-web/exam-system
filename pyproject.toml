[tool.ruff]
line-length = 120
target-version = "py313"
# Migrations are generated by Alembic autogenerate.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Long Vietnamese prompt strings.
"app/ai/provider.py" = ["E501"]
