[tool.ruff]
line-length = 120
target-version = "py313"
# Migrations are generated by Alembic autogenerate.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Long Vietnamese prompt / sample strings.
"app/ai/provider.py" = ["E501"]
"app/ai/schemas.py" = ["E501"]
"app/import_templates.py" = ["E501"]
# Curriculum catalogues: long Vietnamese titles kept on one line.
"app/curriculum_data.py" = ["E501"]
"app/sections_data.py" = ["E501"]
"app/domain/k12_curriculum_data.py" = ["E501"]
"scripts/full_k12_data.py" = ["E501"]
"tests/test_pipeline*.py" = ["E501"]  # HTML fixtures in the shape of the source sites
