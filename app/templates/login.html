{% extends "base.html" %}
{% block title %}Đăng nhập · H2Edu{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Đăng nhập</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
    </label>
    <label>Mật khẩu
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn full">Đăng nhập</button>
  </form>
  <p class="muted center">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
</div>
{% endblock %}
