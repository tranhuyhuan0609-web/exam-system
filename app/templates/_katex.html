{# KaTeX renders $...$ / $$...$$ / \(...\) / \[...\] inside any element passed to renderMath(). #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
{% include "_qtables.html" %}
<script>
  window.renderMath = function (el) {
    if (!el) el = document.body;
    if (window.qTables) window.qTables(el);  // "a | b" lines -> tables, before formulas

    // Auto-wrap raw LaTeX commands that are missing $ delimiters inside question content & choices
    try {
      const items = el.querySelectorAll ? el.querySelectorAll('.math, .q-content, .q-choices li, .choices li, .katex-render') : [];
      items.forEach(function (node) {
        if (node.querySelector && node.querySelector('.katex')) return;
        let txt = node.textContent;
        if (txt && txt.includes('\\') && !txt.includes('$') && !txt.includes('\\(') && !txt.includes('\\[') && !txt.includes('$$')) {
          if (/\\[a-zA-Z]+/.test(txt) && !node.children.length) {
            node.textContent = '$' + txt.trim() + '$';
          }
        }
      });
    } catch (e) {
      console.warn("Auto-wrap latex warning:", e);
    }

    if (!window.renderMathInElement) return;
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
      ],
      throwOnError: false,
    });
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
        onload="renderMath(document.body)"></script>
