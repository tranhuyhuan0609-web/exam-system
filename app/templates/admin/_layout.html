{% extends "base.html" %}
{% block head %}{% include "_katex.html" %}{% endblock %}
{% block container_class %}wide{% endblock %}
{% block content %}
<nav class="subnav">
  <a href="/admin" class="{{ 'active' if active == 'dashboard' }}">Tổng quan</a>
  <a href="/admin/categories" class="{{ 'active' if active == 'subjects' }}">Mục lục</a>
  <a href="/admin/questions" class="{{ 'active' if active == 'questions' }}">Ngân hàng câu hỏi</a>
  <a href="/admin/exams" class="{{ 'active' if active == 'exams' }}">Đề thi</a>
  <a href="/admin/ai-imports" class="{{ 'active' if active == 'ai' }}">🤖 AI nhập đề</a>
</nav>
{% block admin_content %}{% endblock %}
<script>
  // Forms with data-confirm="..." ask before submitting (keeps user text out of inline JS).
  document.addEventListener("submit", (e) => {
    const msg = e.target.dataset.confirm;
    if (msg && !confirm(msg)) e.preventDefault();
  });
</script>
{% endblock %}
