{# Params: name, options, scope_groups, selected, blank (optional label for an empty choice), required (bool) #}
<select name="{{ name }}" {% if required %}required{% endif %}>
  {% if blank %}<option value="">{{ blank }}</option>{% endif %}
  {% if scope_groups %}
    {% for g in scope_groups %}
      <optgroup label="{{ g.label }}">
        {% for o in g.options %}
          <option value="{{ o.key }}" {% if o.key == selected %}selected{% endif %}>{{ o.label }}</option>
        {% endfor %}
      </optgroup>
    {% endfor %}
  {% elif options %}
    {% for o in options %}
      <option value="{{ o.key }}" {% if o.key == selected %}selected{% endif %}
              {% if o.key.startswith('s:') %}class="opt-subject"{% endif %}>{{ o.label }}</option>
    {% endfor %}
  {% endif %}
</select>
