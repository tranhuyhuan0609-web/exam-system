{# Shared exam settings fields. Needs: form, scope_options, show_publish (bool) #}
<label>Tên đề
  <input name="title" value="{{ form.title }}" required maxlength="300" placeholder="VD: Luyện tập Chương 1: Dao động">
</label>
<label>Thuộc môn / chương / bài
  {% with name="scope", options=scope_options, selected=form.scope_key, blank="— Chọn —", required=True %}{% include "admin/_scope_select.html" %}{% endwith %}
</label>
<div class="row">
  <label>Chế độ
    <select disabled><option>Luyện tập (PRACTICE)</option></select>
  </label>
  <label>Thời gian làm bài (phút)
    <input type="number" name="duration_minutes" value="{{ form.duration_minutes }}" min="1" max="600" required>
  </label>
  <label>Số lần làm tối đa
    <input type="number" name="max_attempts" value="{{ form.max_attempts }}" min="1" placeholder="Không giới hạn">
  </label>
</div>
<label>Mô tả <textarea name="description" rows="2">{{ form.description }}</textarea></label>
<fieldset>
  <legend>Câu hỏi của đề</legend>
  <label class="check"><input type="radio" name="question_source" value="FIXED" {% if form.question_source != "MATRIX" %}checked{% endif %}>
    Cố định: tự chọn từng câu, mọi lượt làm cùng một bộ câu</label>
  <label class="check"><input type="radio" name="question_source" value="MATRIX" {% if form.question_source == "MATRIX" %}checked{% endif %}>
    Ma trận: mỗi lượt làm bốc ngẫu nhiên từ ngân hàng theo số câu từng mức độ</label>
  <label class="check"><input type="checkbox" name="shuffle_questions" {% if form.shuffle_questions %}checked{% endif %}>
    Đảo thứ tự câu (trong từng phần I, II, III)</label>
  <label class="check"><input type="checkbox" name="shuffle_choices" {% if form.shuffle_choices %}checked{% endif %}>
    Đảo vị trí đáp án A, B, C, D (câu trắc nghiệm)</label>
  <label class="check"><input type="checkbox" name="allow_custom_parts" {% if form.allow_custom_parts %}checked{% endif %}>
    Cho học sinh tự chọn phần muốn làm (chỉ trắc nghiệm, TN + đúng/sai, …)</label>
</fieldset>
<fieldset>
  <legend>Phân quyền Freemium &amp; PRO</legend>
  <div class="row">
    <label>Phân hạng truy cập
      <select name="access_tier">
        <option value="FREE" {% if form.access_tier != "PRO" %}selected{% endif %}>FREE (Công khai miễn phí)</option>
        <option value="PRO" {% if form.access_tier == "PRO" %}selected{% endif %}>🔒 PRO (Đề độc quyền / Học sinh giỏi)</option>
      </select>
    </label>
    <label>Nguồn đề
      <select name="origin_type">
        <option value="PUBLIC_CRAWLED" {% if form.origin_type != "ORIGINAL" %}selected{% endif %}>Sưu tầm công khai (PUBLIC_CRAWLED)</option>
        <option value="ORIGINAL" {% if form.origin_type == "ORIGINAL" %}selected{% endif %}>Tự biên soạn độc quyền (ORIGINAL)</option>
      </select>
    </label>
    <label>Số câu xem thử (PRO)
      <input type="number" name="preview_question_count" value="{{ form.preview_question_count or '5' }}" min="1" max="50">
    </label>
  </div>
  <label class="check">
    <input type="checkbox" name="is_solution_pro_only" {% if form.is_solution_pro_only %}checked{% endif %}>
    🔒 Khóa lời giải chi tiết từng bước của toàn bộ đề cho gói PRO (mặc định chỉ khóa 5 câu Vận dụng cao cuối đề)
  </label>
</fieldset>
{% if show_publish %}
  <label class="check"><input type="checkbox" name="is_published" {% if form.is_published %}checked{% endif %}> Công khai cho học sinh</label>
{% endif %}
