services:
  # PostgreSQL 17 with the pgvector extension (semantic duplicate detection).
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    ports:
      - "5432:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for uploads, rendered pages and question figures.
  # Pinned version avoids unexpected breaking changes in production.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"  # S3 API (figures are served from here)
      - "9001:9001"  # web console
    volumes:
      - s3data:/data

  # Connection pooler in transaction mode. The application reaches PostgreSQL only through it, as the
  # least-privilege login ulp_api; tenant context is set per transaction (SET LOCAL), which pooling keeps safe.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: exam
      DB_USER: ulp_api
      DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-ulp_api_dev}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      # Belt and braces: session state a client leaves behind (SET ROLE, SET app.*) never reaches the next one.
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_RESET_QUERY_ALWAYS: "1"
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy

  # Cache of public exam papers (answers stripped) and worker broker. Never a source of truth.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Vault in dev mode (in memory, unsealed): Transit keys per user for crypto-shredding. Not for production.
  vault:
    image: hashicorp/vault:1.17
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  # Virus scanning of uploads (clamd on 3310). The first start downloads signatures and takes a few minutes.
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav

  # Question crawler (app/pipeline): Kafka (KRaft, single node) carries raw pages and dead letters.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created by the pipeline with their settings
      KAFKA_MESSAGE_MAX_BYTES: 5242880
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Bronze layer: raw HTML of every crawled page, and dead-letter events.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  # One-shot migration runner: applies Alembic migrations safely before app/worker replicas start.
  # Runs as the schema owner, straight to PostgreSQL; then creates the runtime login the services use.
  migration:
    build: .
    command: sh -c "alembic upgrade head && python -m app.platform.runtime_login"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://exam:exam@db:5432/exam
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-ulp_api_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env  # SECRET_KEY, GEMINI_API_KEY...
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://ulp_api:${RUNTIME_DB_PASSWORD:-ulp_api_dev}@pgbouncer:5432/exam
      DB_PGBOUNCER: "true"
      DATA_DIR: /app/data
      STORAGE_BACKEND: s3
      S3_ENDPOINT: s3:9000
      S3_PUBLIC_URL: http://localhost:9000
      REDIS_URL: redis://redis:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      CLAMAV_HOST: clamav
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
      migration:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started

  # Processes AI import jobs (PDF / Word / photos). Includes LibreOffice for .docx files.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
      migration:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started

  # Crawler processes: scheduler (runs spiders), bronze (raw pages -> MongoDB),
  # silver (parse -> crawled_questions in PostgreSQL) and dlq (dead letters -> MongoDB).
  crawler-scheduler: &pipeline
    build: .
    command: python -m app.pipeline scheduler
    env_file: .env
    environment: &pipeline-env
      <<: *app-env
      KAFKA_BOOTSTRAP: kafka:29092
      MONGO_URL: mongodb://mongo:27017
    depends_on: [db, pgbouncer, kafka, mongo, s3]
  crawler-bronze:
    <<: *pipeline
    command: python -m app.pipeline bronze
  crawler-silver:
    <<: *pipeline
    command: python -m app.pipeline silver
  crawler-dlq:
    <<: *pipeline
    command: python -m app.pipeline dlq
  # Drive files announced by the scheduler -> library (split into exams with OCR, answer tables, AI import jobs).
  # Runs on the worker image: Tesseract and LibreOffice.
  crawler-library:
    <<: *pipeline
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m app.pipeline library

volumes:
  pgdata17:
  s3data:
  kafkadata:
  mongodata:
  clamavdata:
