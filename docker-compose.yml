services:
  # PostgreSQL 17 with the pgvector extension (semantic duplicate detection).
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    ports:
      - "5432:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for uploads, rendered pages and question figures.
  # RustFS is used because MinIO no longer publishes server images; any S3 store works (see .env.example).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"  # S3 API (figures are served from here)
      - "9001:9001"  # web console
    volumes:
      - s3data:/data

  # Question crawler (app/pipeline): Kafka (KRaft, single node) carries raw pages and dead letters.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created by the pipeline with their settings
      KAFKA_MESSAGE_MAX_BYTES: 5242880
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data

  # Bronze layer: raw HTML of every crawled page, and dead-letter events.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  app:
    build: .
    env_file: .env  # SECRET_KEY, GEMINI_API_KEY...
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://exam:exam@db:5432/exam
      DATA_DIR: /app/data
      STORAGE_BACKEND: s3
      S3_ENDPOINT: s3:9000
      S3_PUBLIC_URL: http://localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  # Processes AI import jobs (PDF / Word / photos). Includes LibreOffice for .docx files.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  # Crawler processes: scheduler (runs spiders), bronze (raw pages -> MongoDB),
  # silver (parse -> crawled_questions in PostgreSQL) and dlq (dead letters -> MongoDB).
  crawler-scheduler: &pipeline
    build: .
    command: python -m app.pipeline scheduler
    env_file: .env
    environment: &pipeline-env
      <<: *app-env
      KAFKA_BOOTSTRAP: kafka:29092
      MONGO_URL: mongodb://mongo:27017
    depends_on: [db, kafka, mongo, s3]
  crawler-bronze:
    <<: *pipeline
    command: python -m app.pipeline bronze
  crawler-silver:
    <<: *pipeline
    command: python -m app.pipeline silver
  crawler-dlq:
    <<: *pipeline
    command: python -m app.pipeline dlq
  # Drive files announced by the scheduler -> library (split into exams with OCR, answer tables, AI import jobs).
  # Runs on the worker image: Tesseract and LibreOffice.
  crawler-library:
    <<: *pipeline
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m app.pipeline library

volumes:
  pgdata17:
  s3data:
  kafkadata:
  mongodata:
