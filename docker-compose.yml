services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env  # SECRET_KEY, GEMINI_API_KEY...
    environment:
      DATABASE_URL: postgresql+asyncpg://exam:exam@db:5432/exam
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # Processes AI import jobs (PDF / Word / photos). Includes LibreOffice for .docx files.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://exam:exam@db:5432/exam
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
