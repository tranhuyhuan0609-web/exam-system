name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          POSTGRES_DB: exam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://exam:exam@localhost:5432/exam
      TEST_DATABASE_URL: postgresql+asyncpg://exam:exam@localhost:5432/exam_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Tests that convert Word files (LibreOffice) and typeset exam PDFs (headless Chromium).
      - name: Install LibreOffice and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          playwright install --with-deps chromium
      # Gate 1: static checks and architecture boundaries.
      - run: ruff check .
      - name: Module boundaries (.importlinter)
        run: lint-imports
      - name: Release gate ids match platform_manifest.yaml
        run: bash ci/check_gate_ids.sh
      # Gate 2: schema.
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q
